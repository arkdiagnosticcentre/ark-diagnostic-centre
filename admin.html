<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARK Diagnostic Centre - Admin</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f8fc;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #1565c0;
    }

    h2 {
      text-align: center;
    }

    .login-box {
      max-width: 400px;
      margin: 60px auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .login-box input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: #1565c0;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }

    .login-button {
      width: 100%;
      margin-top: 10px;
    }

    .logout {
      display: block;
      margin: 10px auto 20px;
      background: #d32f2f;
    }

    #loginMessage {
      text-align: center;
      color: red;
      margin-top: 15px;
    }

    .dashboard {
      max-width: 1100px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    th {
      background: #1565c0;
      color: white;
    }

    .loading {
      text-align: center;
      padding: 20px;
    }

    #dashboardSection {
      display: none;
    }
  </style>
</head>

<body>

<h1>ARK Diagnostic Centre</h1>

<div id="loginSection" class="login-box">

  <h2>Admin Login</h2>

  <input
    type="email"
    id="adminEmail"
    placeholder="Admin Email"
  >

  <input
    type="password"
    id="adminPassword"
    placeholder="Password"
  >

  <button id="loginButton" class="login-button">
    Login
  </button>

  <div id="loginMessage"></div>

</div>


<div id="dashboardSection">

  <h2>Appointment Dashboard</h2>

  <button id="logoutButton" class="logout">
    Logout
  </button>

  <div class="dashboard">

    <div id="loading" class="loading">
      Loading appointments...
    </div>

    <table id="appointmentTable" style="display:none;">

      <thead>
        <tr>
          <th>Patient Name</th>
          <th>Mobile Number</th>
          <th>Test / Package</th>
          <th>Appointment Date</th>
          <th>Booked Time</th>
          <th>Status</th>
        </tr>
      </thead>

      <tbody id="appointmentList"></tbody>

    </table>

  </div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


const firebaseConfig = {

  apiKey: "AIzaSyBPNeep_D7i2YBtMCf3tJtF0gFluCprlQg",

  authDomain:
    "ark-diagnostic-centre.firebaseapp.com",

  projectId:
    "ark-diagnostic-centre",

  storageBucket:
    "ark-diagnostic-centre.firebasestorage.app",

  messagingSenderId:
    "238286336140",

  appId:
    "1:238286336140:web:26210cbdcaf290f3a00ba9",

  measurementId:
    "G-0BQ292SWKD"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);


const loginSection =
  document.getElementById("loginSection");

const dashboardSection =
  document.getElementById("dashboardSection");

const loginMessage =
  document.getElementById("loginMessage");


document
.getElementById("loginButton")
.addEventListener("click", async () => {

  const email =
    document.getElementById("adminEmail").value.trim();

  const password =
    document.getElementById("adminPassword").value;
if (!email || !password) {
    loginMessage.textContent = "Please enter email and password.";
    return;
  }

  loginMessage.textContent = "Logging in...";

  try {
    await signInWithEmailAndPassword(auth, email, password);
    loginMessage.textContent = "";
  } catch (error) {
    console.error("Login error:", error);
    loginMessage.textContent = "Invalid email or password.";
  }

});


document
.getElementById("logoutButton")
.addEventListener("click", async () => {
  await signOut(auth);
});


onAuthStateChanged(auth, (user) => {

  if (user) {

    loginSection.style.display = "none";
    dashboardSection.style.display = "block";

    loadAppointments();

  } else {

    loginSection.style.display = "block";
    dashboardSection.style.display = "none";

  }

});


async function loadAppointments() {

  const url =
    "https://firestore.googleapis.com/v1/projects/ark-diagnostic-centre/databases/(default)/documents/appointments";

  const loading =
    document.getElementById("loading");

  const table =
    document.getElementById("appointmentTable");

  const appointmentList =
    document.getElementById("appointmentList");

  loading.style.display = "block";
  loading.textContent = "Loading appointments...";
  table.style.display = "none";
  appointmentList.innerHTML = "";

  try {

    const token = await auth.currentUser.getIdToken();

    const response = await fetch(url, {
      headers: {
        "Authorization": "Bearer " + token
      }
    });

    if (!response.ok) {
      throw new Error("Unable to load appointments");
    }

    const data = await response.json();

    if (!data.documents || data.documents.length === 0) {
      loading.textContent = "No appointments found.";
      return;
    }

    data.documents.forEach(doc => {

      const fields = doc.fields || {};

      const name = fields.name?.stringValue || "-";
      const phone = fields.phone?.stringValue || "-";
      const test = fields.test?.stringValue || "-";
      const date = fields.date?.stringValue || "-";
const status = fields.status?.stringValue || "Pending";
      let createdAt = "-";

      if (fields.createdAt?.timestampValue) {
        createdAt = new Date(
          fields.createdAt.timestampValue
        ).toLocaleString("en-IN");
      }

      const row = document.createElement("tr");

      row.innerHTML = `
  <td>${name}</td>
  <td>${phone}</td>
  <td>${test}</td>
  <td>${date}</td>
  <td>${createdAt}</td>
  <td>
    <select class="status-select">
      <option value="Pending">Pending</option>
      <option value="Confirmed">Confirmed</option>
      <option value="Completed">Completed</option>
    </select>
  </td>
`;

      appointmentList.appendChild(row);

    });

    loading.style.display = "none";
    table.style.display = "table";

  } catch (error) {

    console.error("Appointment loading error:", error);

    loading.textContent =
      "Appointments could not be loaded.";

  }
}

</script>

</body>
</html>
