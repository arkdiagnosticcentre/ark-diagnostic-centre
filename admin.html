<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARK Diagnostic Centre - Admin</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f8fc;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #1565c0;
    }

    h2 {
      text-align: center;
    }

    .login-box {
      max-width: 400px;
      margin: 60px auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .login-box input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: #1565c0;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }

    .login-button {
      width: 100%;
      margin-top: 10px;
    }

    .logout {
      display: block;
      margin: 10px auto 20px;
      background: #d32f2f;
    }

    #loginMessage {
      text-align: center;
      color: red;
      margin-top: 15px;
    }

    .dashboard {
      max-width: 1100px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    th {
      background: #1565c0;
      color: white;
    }

    .loading {
      text-align: center;
      padding: 20px;
    }

    #dashboardSection {
      display: none;
    }
  </style>
</head>

<body>

<h1>ARK Diagnostic Centre</h1>

<div id="loginSection" class="login-box">

  <h2>Admin Login</h2>

  <input
    type="email"
    id="adminEmail"
    placeholder="Admin Email"
  >

  <input
    type="password"
    id="adminPassword"
    placeholder="Password"
  >

  <button id="loginButton" class="login-button">
    Login
  </button>

  <div id="loginMessage"></div>

</div>


<div id="dashboardSection">

  <h2>Appointment Dashboard</h2>

  <button id="logoutButton" class="logout">
    Logout
  </button>

  <div class="dashboard">

    <div id="loading" class="loading">
      Loading appointments...
    </div>

    <table id="appointmentTable" style="display:none;">

      <thead>
        <tr>
          <th>Patient Name</th>
          <th>Mobile Number</th>
          <th>Test / Package</th>
          <th>Appointment Date</th>
          <th>Booked Time</th>
        </tr>
      </thead>

      <tbody id="appointmentList"></tbody>

    </table>

  </div>

</div>
