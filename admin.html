<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARK Diagnostic Centre - Admin</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f8fc;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #1565c0;
    }

    h2 {
      text-align: center;
    }

    .login-box {
      max-width: 400px;
      margin: 60px auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .login-box input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: #1565c0;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }

    .login-button {
      width: 100%;
      margin-top: 10px;
    }

    .logout {
      display: block;
      margin: 10px auto 20px;
      background: #d32f2f;
    }

    #loginMessage {
      text-align: center;
      color: red;
      margin-top: 15px;
    }

    .dashboard {
      max-width: 1100px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    th {
      background: #1565c0;
      color: white;
    }

    .loading {
      text-align: center;
      padding: 20px;
    }

    #dashboardSection {
      display: none;
    }
  </style>
</head>

<body>

<h1>ARK Diagnostic Centre</h1>

<div id="loginSection" class="login-box">

  <h2>Admin Login</h2>

  <input
    type="email"
    id="adminEmail"
    placeholder="Admin Email"
  >

  <input
    type="password"
    id="adminPassword"
    placeholder="Password"
  >

  <button id="loginButton" class="login-button">
    Login
  </button>

  <div id="loginMessage"></div>

</div>


<div id="dashboardSection">

  <h2>Appointment Dashboard</h2>

  <button id="logoutButton" class="logout">
    Logout
  </button>
<div style="max-width:1100px; margin:20px auto;">
  <input
    type="text"
    id="searchInput"
    placeholder="Search Patient Name / Mobile Number"
    style="width:100%; box-sizing:border-box; padding:13px; border:1px solid #ccc; border-radius:8px; font-size:16px;"
  >
</div>

<div style="text-align:center; margin-bottom:20px;">
  <button id="todayButton">Today Appointments</button>
  <button id="allButton">Show All</button>
</div>
  <div class="dashboard">

    <div id="loading" class="loading">
      Loading appointments...
    </div>

    <table id="appointmentTable" style="display:none;">

      <thead>
        <tr>
          <th>Patient Name</th>
          <th>Mobile Number</th>
          <th>Test / Package</th>
          <th>Appointment Date</th>
          <th>Booked Time</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody id="appointmentList"></tbody>

    </table>

  </div>

</div>


<script type="module">
document
.getElementById("searchInput")
.addEventListener("input", function () {

  const searchValue =
    this.value.toLowerCase().trim();

  const rows =
    document.querySelectorAll("#appointmentList tr");

  rows.forEach(row => {

    const patientName =
      row.cells[0]?.textContent.toLowerCase() || "";

    const mobileNumber =
      row.cells[1]?.textContent.toLowerCase() || "";

    if (
      patientName.includes(searchValue) ||
      mobileNumber.includes(searchValue)
    ) {
      row.style.display = "";
    } else {
      row.style.display = "none";
    }

  });

});
import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {
  getFirestore,
  doc,
  deleteDoc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {

  apiKey: "AIzaSyBPNeep_D7i2YBtMCf3tJtF0gFluCprlQg",

  authDomain:
    "ark-diagnostic-centre.firebaseapp.com",

  projectId:
    "ark-diagnostic-centre",

  storageBucket:
    "ark-diagnostic-centre.firebasestorage.app",

  messagingSenderId:
    "238286336140",

  appId:
    "1:238286336140:web:26210cbdcaf290f3a00ba9",

  measurementId:
    "G-0BQ292SWKD"
};


const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);


const loginSection =
  document.getElementById("loginSection");

const dashboardSection =
  document.getElementById("dashboardSection");

const loginMessage =
  document.getElementById("loginMessage");


document
.getElementById("loginButton")
.addEventListener("click", async () => {

  const email =
    document.getElementById("adminEmail").value.trim();

  const password =
    document.getElementById("adminPassword").value;
if (!email || !password) {
    loginMessage.textContent = "Please enter email and password.";
    return;
  }

  loginMessage.textContent = "Logging in...";

  try {
    await signInWithEmailAndPassword(auth, email, password);
    loginMessage.textContent = "";
  } catch (error) {
    console.error("Login error:", error);
    loginMessage.textContent = "Invalid email or password.";
  }

});


document
.getElementById("logoutButton")
.addEventListener("click", async () => {
  await signOut(auth);
});


onAuthStateChanged(auth, (user) => {

  if (user) {

    loginSection.style.display = "none";
    dashboardSection.style.display = "block";

    loadAppointments();

  } else {

    loginSection.style.display = "block";
    dashboardSection.style.display = "none";

  }

});


async function loadAppointments() {

  const url =
    "https://firestore.googleapis.com/v1/projects/ark-diagnostic-centre/databases/(default)/documents/appointments";

  const loading =
    document.getElementById("loading");

  const table =
    document.getElementById("appointmentTable");

  const appointmentList =
    document.getElementById("appointmentList");

  loading.style.display = "block";
  loading.textContent = "Loading appointments...";
  table.style.display = "none";
  appointmentList.innerHTML = "";

  try {

    const token = await auth.currentUser.getIdToken();

    const response = await fetch(url, {
      headers: {
        "Authorization": "Bearer " + token
      }
    });

    if (!response.ok) {
      throw new Error("Unable to load appointments");
    }

    const data = await response.json();

    if (!data.documents || data.documents.length === 0) {
      loading.textContent = "No appointments found.";
      return;
    }

    data.documents.forEach(appointmentDoc => {

      const fields = appointmentDoc.fields || {};

      const name = fields.name?.stringValue || "-";
      const phone = fields.phone?.stringValue || "-";
      const test = fields.test?.stringValue || "-";
      const date = fields.date?.stringValue || "-";
const status = fields.status?.stringValue || "Pending";
      let createdAt = "-";

      if (fields.createdAt?.timestampValue) {
        createdAt = new Date(
          fields.createdAt.timestampValue
        ).toLocaleString("en-IN");
      }

      const row = document.createElement("tr");

      row.innerHTML = `
  <td>${name}</td>
  <td>${phone}</td>
  <td>${test}</td>
  <td>${date}</td>
  <td>${createdAt}</td>
  <td>
  
    <select class="status-select" data-doc="${appointmentDoc.name}">
  <option value="Pending" ${status === "Pending" ? "selected" : ""}>Pending</option>
  <option value="Confirmed" ${status === "Confirmed" ? "selected" : ""}>Confirmed</option>
  <option value="Completed" ${status === "Completed" ? "selected" : ""}>Completed</option>
</select>
</td>

<td>
  <button
    class="whatsapp-btn"
    data-phone="${phone}"
    data-name="${name}"
    data-test="${test}"
    data-date="${date}">
    WhatsApp
  </button>

  <button class="delete-btn" data-doc="${appointmentDoc.name}">
    Delete
  </button>
</td>
  `;
      appointmentList.appendChild(row);
      const whatsappButton = row.querySelector(".whatsapp-btn");

whatsappButton.addEventListener("click", function () {

  let phone = this.dataset.phone.replace(/\D/g, "");

  if (phone.length === 10) {
    phone = "91" + phone;
  }

  const name = this.dataset.name;
  const test = this.dataset.test;
  const date = this.dataset.date;

  const message =
  `Hello ${name}, your appointment at ARK Diagnostic Centre has been confirmed.\n\nTest / Package: ${test}\nAppointment Date: ${date}\n\nThank you for choosing ARK Diagnostic Centre.`;

const whatsappURL =
  "https://wa.me/" + phone +
  "?text=" + encodeURIComponent(message);

window.open(whatsappURL, "_blank");

});
const deleteButton = row.querySelector(".delete-btn");

deleteButton.addEventListener("click", async function () {

  const documentPath = this.dataset.doc;

  if (!confirm("Are you sure you want to delete this appointment?")) {
    return;
  }

  try {
    const token = await auth.currentUser.getIdToken();

    const deleteURL =
      "https://firestore.googleapis.com/v1/" + documentPath;

    const response = await fetch(deleteURL, {
      method: "DELETE",
      headers: {
        "Authorization": "Bearer " + token
      }
    });

    if (!response.ok) {
      const errorText = await response.text();
      throw new Error(errorText);
    }

    row.remove();
    alert("Appointment deleted successfully.");

  } catch (error) {
    console.error("Delete error:", error);
    alert("Could not delete appointment.");
  }

});
      const statusSelect = row.querySelector(".status-select");

statusSelect.addEventListener("change", async function () {

  const newStatus = this.value;
  const documentPath = this.dataset.doc;

  try {

    const token = await auth.currentUser.getIdToken();

    const updateURL =
      "https://firestore.googleapis.com/v1/" +
      documentPath +
      "?updateMask.fieldPaths=status";

    const response = await fetch(updateURL, {
      method: "PATCH",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + token
      },
      body: JSON.stringify({
        fields: {
          status: {
            stringValue: newStatus
          }
        }
      })
    });

    if (!response.ok) {
      throw new Error("Status update failed");
    }

    alert("Status updated successfully.");

  } catch (error) {

    console.error(error);
    alert("Status could not be updated.");

  }

});
    });

    loading.style.display = "none";
    table.style.display = "table";

  } catch (error) {

    console.error("Appointment loading error:", error);

    loading.textContent =
      "Appointments could not be loaded.";

  }
}
document.getElementById("todayButton").addEventListener("click", () => {
  const today = new Date();
  const yyyy = today.getFullYear();
  const mm = String(today.getMonth() + 1).padStart(2, "0");
  const dd = String(today.getDate()).padStart(2, "0");

  const todayDate = `${yyyy}-${mm}-${dd}`;

  document.querySelectorAll("#appointmentList tr").forEach(row => {
    const appointmentDate = row.cells[3]?.textContent.trim();

    row.style.display =
      appointmentDate === todayDate ? "" : "none";
  });
});

document.getElementById("allButton").addEventListener("click", () => {
  document.querySelectorAll("#appointmentList tr").forEach(row => {
    row.style.display = "";
  });

  document.getElementById("searchInput").value = "";
});
  document.getElementById("todayButton").addEventListener("click", () => {
  const today = new Date();
  const yyyy = today.getFullYear();
  const mm = String(today.getMonth() + 1).padStart(2, "0");
  const dd = String(today.getDate()).padStart(2, "0");

  const todayDate = `${yyyy}-${mm}-${dd}`;

  document.querySelectorAll("#appointmentList tr").forEach(row => {
    const appointmentDate = row.cells[3]?.textContent.trim();

    row.style.display =
      appointmentDate === todayDate ? "" : "none";
  });
});

document.getElementById("allButton").addEventListener("click", () => {
  document.querySelectorAll("#appointmentList tr").forEach(row => {
    row.style.display = "";
  });

  document.getElementById("searchInput").value = "";
});
document.getElementById("searchInput").addEventListener("input", function () {

  const searchValue = this.value.toLowerCase().trim();

  document.querySelectorAll("#appointmentList tr").forEach(row => {

    const patientName =
      row.cells[0]?.textContent.toLowerCase() || "";

    const mobileNumber =
      row.cells[1]?.textContent.toLowerCase() || "";

    if (
      patientName.includes(searchValue) ||
      mobileNumber.includes(searchValue)
    ) {
      row.style.display = "";
    } else {
      row.style.display = "none";
    }

  });

});
</script>

</body>
</html>
