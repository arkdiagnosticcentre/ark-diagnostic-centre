<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Patient Report | ARK Diagnostic Centre</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f8fd;
      color: #1f2937;
    }

    .header {
      background: linear-gradient(135deg, #0d47a1, #1976d2);
      color: white;
      text-align: center;
      padding: 30px 15px;
    }

    .header h1 {
      margin: 0;
      font-size: 30px;
    }

    .header p {
      margin: 8px 0 0;
      opacity: 0.95;
    }

    .container {
      max-width: 650px;
      margin: 35px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 6px 25px rgba(0,0,0,0.10);
    }

    .success {
      text-align: center;
      font-size: 55px;
      margin-bottom: 10px;
    }

    .card h2 {
      text-align: center;
      color: #1565c0;
      margin-top: 5px;
    }

    .details {
      margin-top: 30px;
      background: #f7faff;
      border-radius: 12px;
      padding: 20px;
    }

    .detail-row {
      padding: 10px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .label {
      font-weight: bold;
      color: #555;
    }

    .value {
      margin-top: 5px;
      font-size: 17px;
    }

    .buttons {
      margin-top: 25px;
      display: grid;
      gap: 12px;
    }

    .btn {
      display: block;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      text-decoration: none;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    .view {
      background: #1565c0;
    }

    .download {
      background: #00897b;
    }

    .footer {
      text-align: center;
      margin-top: 30px;
      color: #666;
      line-height: 1.6;
      font-size: 14px;
    }

    .error {
      text-align: center;
      color: #d32f2f;
      padding: 20px;
    }

    @media (max-width: 600px) {
      .header h1 {
        font-size: 24px;
      }

      .card {
        padding: 22px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>ARK Diagnostic Centre</h1>
    <p>Accurate Diagnostics • Trusted Care</p>
  </div>

  <div class="container">

    <div class="card" id="reportCard">

      <div class="success">✓</div>

      <h2>Your Laboratory Report is Ready</h2>

      <div class="details">

        <div class="detail-row">
          <div class="label">Patient Name</div>
          <div class="value" id="patientName">-</div>
        </div>

        <div class="detail-row">
          <div class="label">Test / Package</div>
          <div class="value" id="testName">-</div>
        </div>

      </div>

      <div class="buttons">

        <a
          id="viewReport"
          class="btn view"
          href="#"
          target="_blank"
          rel="noopener noreferrer">
          View Report
        </a>

        <a
          id="downloadReport"
          class="btn download"
          href="#"
          target="_blank"
          rel="noopener noreferrer">
          Download Report
        </a>

      </div>

      <div class="footer">
        <strong>ARK Diagnostic Centre</strong><br>
        Bus Stand Back Side, Beside Dr Vijay Kumar Clinic,<br>
        Subhash Nagar, Kalwakurthy<br><br>

        For assistance: 9398908582
      </div>

    </div>

  </div>

<script>

  const params = new URLSearchParams(window.location.search);

  const patient = params.get("name");
  const test = params.get("test");
  const reportURL = params.get("url");

  const patientName =
    document.getElementById("patientName");

  const testName =
    document.getElementById("testName");

  const viewReport =
    document.getElementById("viewReport");

  const downloadReport =
    document.getElementById("downloadReport");

  if (patient) {
    patientName.textContent = patient;
  }

  if (test) {
    testName.textContent = test;
  }

  if (reportURL) {

    viewReport.href = reportURL;
    downloadReport.href = reportURL;

  } else {

    document.querySelector(".buttons").innerHTML =
      '<div class="error">Report link is not available.</div>';

  }

</script>

</body>
</html>
