<script>
const mobileInput = document.getElementById("mobileNumber");
const searchButton = document.getElementById("searchButton");
const message = document.getElementById("message");
const reportsList = document.getElementById("reportsList");

searchButton.addEventListener("click", searchReports);

mobileInput.addEventListener("keydown", function (event) {
  if (event.key === "Enter") {
    searchReports();
  }
});

async function searchReports() {
  const phone = mobileInput.value.replace(/\D/g, "");

  reportsList.innerHTML = "";
  message.style.color = "#333";

  if (phone.length !== 10) {
    message.style.color = "#d32f2f";
    message.textContent = "Please enter a valid 10-digit mobile number.";
    return;
  }

  message.textContent = "Searching reports...";
  searchButton.disabled = true;
  searchButton.textContent = "Searching...";

  try {
    // Uses your secure Vercel API
    const response = await fetch(
      `/api/reports?phone=${encodeURIComponent(phone)}`
    );

    const data = await response.json();

    if (!response.ok || !data.success) {
      throw new Error(data.error || "Unable to load reports.");
    }

    const reports = data.reports || [];

    if (reports.length === 0) {
      message.style.color = "#d32f2f";
      message.textContent = "No reports found for this mobile number.";
      return;
    }

    message.style.color = "#00897b";
    message.textContent = `${reports.length} report(s) found.`;

    reports.forEach(report => {
      const card = document.createElement("div");
      card.className = "report-card";

      const title = document.createElement("h3");
      title.textContent = report.name || "Patient";

      const testText = document.createElement("p");
      testText.textContent =
        "Test / Package: " + (report.test || "-");

      const dateText = document.createElement("p");
      dateText.textContent =
        "Appointment Date: " + (report.date || "-");

      const buttons = document.createElement("div");
      buttons.className = "buttons";

      if (report.reportURL) {
        const viewButton = document.createElement("a");
        viewButton.className = "report-btn view-btn";
        viewButton.textContent = "View Report";
        viewButton.href = report.reportURL;
        viewButton.target = "_blank";
        viewButton.rel = "noopener noreferrer";

        const downloadButton = document.createElement("a");
        downloadButton.className = "report-btn download-btn";
        downloadButton.textContent = "Download Report";
        downloadButton.href = report.reportURL;
        downloadButton.target = "_blank";
        downloadButton.rel = "noopener noreferrer";

        buttons.appendChild(viewButton);
        buttons.appendChild(downloadButton);
      }

      card.appendChild(title);
      card.appendChild(testText);
      card.appendChild(dateText);
      card.appendChild(buttons);

      reportsList.appendChild(card);
    });

  } catch (error) {
    console.error("Report Error:", error);

    message.style.color = "#d32f2f";
    message.textContent =
      "Reports could not be loaded. Please contact ARK Diagnostic Centre.";

  } finally {
    searchButton.disabled = false;
    searchButton.textContent = "Search Reports";
  }
}
</script>
