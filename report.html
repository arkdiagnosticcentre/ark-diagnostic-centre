<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Patient Reports | ARK Diagnostic Centre</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f8fc;
      color: #1f2937;
    }

    .header {
      background: linear-gradient(135deg, #0d47a1, #1976d2);
      color: white;
      text-align: center;
      padding: 30px 15px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .header p {
      margin: 0;
      font-size: 16px;
      opacity: 0.95;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: 40px auto;
      padding: 0 15px;
    }

    .search-box {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.10);
    }

    .search-box h2 {
      text-align: center;
      margin: 0 0 10px;
      color: #1565c0;
    }

    .description {
      text-align: center;
      color: #666;
      margin: 0 0 22px;
      line-height: 1.5;
    }

    .mobile-input {
      width: 100%;
      padding: 15px;
      border: 1px solid #bbb;
      border-radius: 8px;
      font-size: 17px;
      margin-bottom: 15px;
      outline: none;
    }

    .mobile-input:focus {
      border-color: #1565c0;
      box-shadow: 0 0 0 2px rgba(21, 101, 192, 0.10);
    }

    .search-button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 8px;
      background: #1565c0;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .search-button:hover {
      background: #0d47a1;
    }

    .search-button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    #message {
      text-align: center;
      margin-top: 20px;
      font-weight: bold;
    }

    #reports {
      margin-top: 20px;
    }

    .report-card {
      background: #f4f8fc;
      border: 1px solid #e1e8f0;
      border-radius: 12px;
      padding: 18px;
      margin-top: 15px;
      text-align: left;
    }

    .report-row {
      margin-bottom: 10px;
      line-height: 1.5;
    }

    .view-report {
      display: block;
      width: 100%;
      margin-top: 15px;
      padding: 13px;
      border-radius: 8px;
      background: #1565c0;
      color: white;
      text-align: center;
      text-decoration: none;
      font-weight: bold;
    }

    .view-report:hover {
      background: #0d47a1;
    }

    .footer {
      text-align: center;
      color: #666;
      padding: 25px 15px;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .header {
        padding: 25px 15px;
      }

      .header h1 {
        font-size: 24px;
      }

      .container {
        margin: 25px auto;
      }

      .search-box {
        padding: 22px 18px;
      }

      .search-box h2 {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <h1>ARK Diagnostic Centre</h1>
    <p>Patient Report Portal</p>
  </header>

  <main class="container">

    <div class="search-box">

      <h2>View Your Laboratory Reports</h2>

      <p class="description">
        Enter your registered 10-digit mobile number to search your reports.
      </p>

      <input
        type="tel"
        id="mobileNumber"
        class="mobile-input"
        placeholder="Enter 10-digit mobile number"
        maxlength="10"
        inputmode="numeric"
        autocomplete="tel"
      >

      <button
        type="button"
        id="searchButton"
        class="search-button"
      >
        Search Reports
      </button>

      <div id="message"></div>

      <div id="reports"></div>

    </div>

  </main>

  <footer class="footer">
    © 2026 ARK Diagnostic Centre, Kalwakurthy
  </footer>


  <script>

    const mobileInput =
      document.getElementById("mobileNumber");

    const searchButton =
      document.getElementById("searchButton");

    const message =
      document.getElementById("message");

    const reportsContainer =
      document.getElementById("reports");


    // Allow only numbers
    mobileInput.addEventListener("input", function () {

      this.value = this.value
        .replace(/\D/g, "")
        .slice(0, 10);

    });


    // Search when Enter key is pressed
    mobileInput.addEventListener("keydown", function (event) {

      if (event.key === "Enter") {
        searchReport();
      }

    });


    // Search button
    searchButton.addEventListener("click", searchReport);


    async function searchReport() {

      const mobile =
        mobileInput.value.replace(/\D/g, "").trim();


      message.innerHTML = "";
      reportsContainer.innerHTML = "";


      // Validate mobile number
      if (!/^\d{10}$/.test(mobile)) {

        message.style.color = "#d32f2f";

        message.textContent =
          "Please enter a valid 10-digit mobile number.";

        return;
      }


      searchButton.disabled = true;
      searchButton.textContent = "Searching...";

      message.style.color = "#1565c0";
      message.textContent = "Searching reports...";


      try {

        /*
          IMPORTANT:
          This calls your Vercel API:
          /api/reports.js
        */

        const response = await fetch(
          "/api/reports?phone=" + encodeURIComponent(mobile),
          {
            method: "GET",
            headers: {
              "Accept": "application/json"
            },
            cache: "no-store"
          }
        );


        let data;

        try {
          data = await response.json();
        } catch (jsonError) {

          throw new Error(
            "Invalid response received from server."
          );

        }


        if (!response.ok) {

          throw new Error(
            data.error || "Unable to load reports."
          );

        }


        if (
          !data.reports ||
          !Array.isArray(data.reports) ||
          data.reports.length === 0
        ) {

          message.style.color = "#d32f2f";

          message.textContent =
            "No report found for this mobile number.";

          return;
        }


        message.style.color = "#2e7d32";

        message.textContent =
          data.reports.length +
          (data.reports.length === 1
            ? " report found."
            : " reports found.");


        data.reports.forEach(function (report) {

          const card =
            document.createElement("div");

          card.className = "report-card";


          const patientRow =
            document.createElement("div");

          patientRow.className = "report-row";

          const patientLabel =
            document.createElement("strong");

          patientLabel.textContent = "Patient: ";

          patientRow.appendChild(patientLabel);

          patientRow.appendChild(
            document.createTextNode(
              report.name || "Patient"
            )
          );


          const testRow =
            document.createElement("div");

          testRow.className = "report-row";

          const testLabel =
            document.createElement("strong");

          testLabel.textContent = "Test: ";

          testRow.appendChild(testLabel);

          testRow.appendChild(
            document.createTextNode(
              report.test || "-"
            )
          );


          const dateRow =
            document.createElement("div");

          dateRow.className = "report-row";

          const dateLabel =
            document.createElement("strong");

          dateLabel.textContent = "Date: ";

          dateRow.appendChild(dateLabel);

          dateRow.appendChild(
            document.createTextNode(
              report.date || "-"
            )
          );


          card.appendChild(patientRow);
          card.appendChild(testRow);
          card.appendChild(dateRow);


          if (report.reportURL) {

            const reportLink =
              document.createElement("a");

            reportLink.className = "view-report";

            reportLink.textContent = "View Report";

            reportLink.href = report.reportURL;

            reportLink.target = "_blank";

            reportLink.rel =
              "noopener noreferrer";

            card.appendChild(reportLink);

          } else {

            const unavailable =
              document.createElement("div");

            unavailable.style.color = "#d32f2f";
            unavailable.style.marginTop = "12px";

            unavailable.textContent =
              "Report not uploaded yet.";

            card.appendChild(unavailable);

          }


          reportsContainer.appendChild(card);

        });


      } catch (error) {

        console.error(
          "Report search error:",
          error
        );

        message.style.color = "#d32f2f";

        message.textContent =
          error.message ||
          "Unable to load reports. Please try again.";

      } finally {

        searchButton.disabled = false;

        searchButton.textContent =
          "Search Reports";

      }

    }

  </script>

</body>
</html>
