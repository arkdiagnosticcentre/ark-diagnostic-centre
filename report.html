 
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Patient Reports | ARK Diagnostic Centre</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f8fc;
      color: #1f2937;
    }

    .header {
      background: linear-gradient(135deg, #0d47a1, #1976d2);
      color: white;
      text-align: center;
      padding: 30px 15px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .header p {
      margin: 0;
      font-size: 16px;
    }

    .container {
      max-width: 650px;
      margin: 40px auto;
      padding: 0 15px;
    }

    .search-box {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.10);
    }

    .search-box h2 {
      text-align: center;
      margin-top: 0;
      color: #1565c0;
    }

    .search-box p {
      text-align: center;
      color: #666;
      margin-bottom: 22px;
    }

    .mobile-input {
      width: 100%;
      padding: 15px;
      border: 1px solid #bbb;
      border-radius: 8px;
      font-size: 17px;
      margin-bottom: 15px;
      outline: none;
    }

    .mobile-input:focus {
      border-color: #1565c0;
    }

    .search-button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 8px;
      background: #1565c0;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .search-button:hover {
      background: #0d47a1;
    }

    #message {
      text-align: center;
      margin-top: 20px;
      font-weight: bold;
    }

    .footer {
      text-align: center;
      color: #666;
      padding: 25px 15px;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .header h1 {
        font-size: 24px;
      }

      .container {
        margin: 25px auto;
      }

      .search-box {
        padding: 22px 18px;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <h1>ARK Diagnostic Centre</h1>
    <p>Patient Report Portal</p>
  </header>

  <main class="container">

    <div class="search-box">

      <h2>View Your Laboratory Reports</h2>

      <p>
        Enter your registered mobile number to view your reports
      </p>

      <input
        type="tel"
        id="mobileNumber"
        class="mobile-input"
        placeholder="Enter 10-digit mobile number"
        maxlength="10"
        inputmode="numeric"
      >

      <button
        type="button"
        class="search-button"
        onclick="searchReport()"
      >
        Search Reports
      </button>

      <div id="message"></div>

    </div>

  </main>

  <footer class="footer">
    © 2026 ARK Diagnostic Centre, Kalwakurthy
  </footer>

  <script>
    function searchReport() {

      const mobile =
        document.getElementById("mobileNumber").value.trim();

      const message =
        document.getElementById("message");

      if (!/^[0-9]{10}$/.test(mobile)) {

        message.style.color = "red";

        message.innerHTML =
          "Please enter a valid 10-digit mobile number.";

        return;
      }

      message.style.color = "#1565c0";

      message.innerHTML =
        "Searching reports...";

      // Firebase report search will be added here next.
    }
  </script>

</body>
</html>
