<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Patient Reports | ARK Diagnostic Centre</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f8fc;
      color: #1f2937;
    }

    .header {
      background: linear-gradient(135deg, #0d47a1, #1976d2);
      color: white;
      text-align: center;
      padding: 30px 15px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .header p {
      margin: 0;
      font-size: 16px;
      opacity: 0.95;
    }

    .container {
      max-width: 800px;
      margin: 35px auto;
      padding: 0 15px;
    }

    .search-box {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
    }

    .search-box h2 {
      text-align: center;
      margin-top: 0;
      color: #1565c0;
    }

    .search-box p {
      text-align: center;
      color: #666;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 12px;
      outline: none;
    }

    input:focus {
      border-color: #1565c0;
    }

    .search-button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #1565c0;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .search-button:hover {
      background: #0d47a1;
    }

    .search-button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    #message {
      text-align: center;
      margin: 20px 0;
      font-weight: bold;
    }

    .report-card {
      background: white;
      margin-top: 18px;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 3px 14px rgba(0, 0, 0, 0.08);
    }

    .report-card h3 {
      color: #1565c0;
      margin-top: 0;
      margin-bottom: 15px;
    }

    .report-card p {
      margin: 8px 0;
      line-height: 1.5;
    }

    .buttons {
      margin-top: 18px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
